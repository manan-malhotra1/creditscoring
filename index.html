<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sasai Credit: Rule Engine Console</title>
<link rel="icon" type="image/svg+xml" href="assets/sasai-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="brand-logo" src="assets/sasai-logo-reversed.svg" alt="Sasai" width="112" height="23" />
      <div class="brand-sub">Credit Rule Engine Console</div>
    </div>

    <nav class="sidebar-nav" id="nav">
      <div class="nav-heading">Configure</div>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar">TM</div>
      <div class="user-meta">
        <div class="user-name">T. Moyo</div>
        <div class="user-role">Credit Risk, Maker</div>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar" id="topbar"></header>

    <div class="content" id="view"></div>

  </main>

  <div id="modal"></div>

  <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

</div>


<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
